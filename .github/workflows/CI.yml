name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      run_real_harmony_responses:
        description: "Run real Harmony/Responses API job"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      run_qualia_benchmark:
        description: "Run optional Responses/Qualia benchmark"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-without-agix:
    name: Tests without AGIX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test dependencies without AGIX runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip uninstall -y agix || true

      - name: Verify AGIX is absent
        run: |
          python - <<'PY'
          import importlib.util
          raise SystemExit(0 if importlib.util.find_spec("agix") is None else "agix unexpectedly installed")
          PY

      - name: Run local-safe tests without AGIX
        env:
          AGIX_RUNTIME_PROFILE: local_safe
          AGIX_REQUIRE_RUNTIME: "false"
        run: |
          pytest --ignore=tests/test_api_endpoints.py -m "not external_resource"

  tests-with-agix:
    name: Tests with agix==1.9.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package, tests, and pinned AGIX
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install "agix==1.9.0"

      - name: Verify AGIX version
        run: |
          python - <<'PY'
          from importlib import metadata
          assert metadata.version("agix") == "1.9.0"
          PY

      - name: Run tests with AGIX available
        env:
          AGIX_RUNTIME_PROFILE: degraded
        run: |
          pytest --ignore=tests/test_api_endpoints.py \
            --ignore=tests/test_simple_browser_encoding.py \
            -m "not external_resource" \
            --deselect=tests/test_agix_qualia_config.py::test_local_safe_starts_without_agix_and_keeps_advanced_adapters_disabled \
            --deselect=tests/test_agix_qualia_config.py::test_strict_compatible_fails_clearly_without_agix_or_with_wrong_version \
            --deselect=tests/test_agix_qualia_config.py::test_strict_compatible_starts_with_simulated_compatible_components \
            --deselect=tests/test_meta_router.py::test_meta_router_records_qualia_feedback_after_direct_route \
            --deselect=tests/test_planner_reasoning_meta.py::test_execute_plan_error_when_no_expert_matches \
            --deselect=tests/test_qualia_node.py::test_qualia_node_exposes_evolution_contract_in_compatibility_payload

  real-harmony-responses:
    name: Real Harmony and Responses API
    if: github.event_name != 'workflow_dispatch' || inputs.run_real_harmony_responses == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run real Harmony/Responses API tests
        env:
          AGIX_RUNTIME_PROFILE: local_safe
        run: |
          pytest tests/test_responses_api.py -m "unit or integration"

  ruff:
    name: Ruff check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip ruff

      - name: Run Ruff
        run: |
          ruff check .

  type-check:
    name: Type checking with pyright
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and Pyright
        run: |
          python -m pip install --upgrade pip pyright
          python -m pip install -e ".[test]"

      - name: Run Pyright
        run: |
          pyright

  build:
    name: Build wheel and sdist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip build

      - name: Build distributions
        run: |
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  install-artifacts:
    name: Clean install wheel and sdist
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        artifact-type: [wheel, sdist]

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ${{ matrix.artifact-type }} in a clean venv
        shell: bash
        run: |
          python -m venv /tmp/gpt-oss-agi-install-check
          source /tmp/gpt-oss-agi-install-check/bin/activate
          python -m pip install --upgrade pip
          if [ "${{ matrix.artifact-type }}" = "wheel" ]; then
            python -m pip install dist/*.whl
          else
            python -m pip install dist/*.tar.gz
          fi
          python - <<'PY'
          import gpt_oss
          import agicore_core
          print("installed", gpt_oss.__name__, agicore_core.__name__)
          PY

  dependency-audit:
    name: Dependency audit with pip-audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install -e ".[test]"

      - name: Run pip-audit
        run: |
          pip-audit

  optional-qualia-benchmark:
    name: Optional Responses/Qualia Benchmark
    if: github.event_name == 'workflow_dispatch' && inputs.run_qualia_benchmark == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run non-blocking Qualia benchmark
        run: |
          python benchmarks/bench_responses_qualia.py --iterations 3 --warmup 1 --target-tokens 256 --chunk-size 16 --strict-agix --json benchmark-results/qualia.json

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualia-benchmark-results
          path: benchmark-results/
          if-no-files-found: ignore

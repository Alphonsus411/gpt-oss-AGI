[project]
name = "gpt-oss-agi"
description = "Experimental unofficial community fork of gpt-oss with AGIX/Qualia governance integrations"

dependencies = [
  "openai-harmony",
  "tiktoken>=0.9.0",
  "aiohttp>=3.12.14",
  "chz>=0.3.0",
  "docker>=7.1.0",
  "fastapi>=0.115,<0.116",
  "html2text>=2025.4.15",
  "lxml>=4.9.4",
  "pydantic>=2.11.7",
  "structlog>=25.4.0",
  "tenacity>=9.1.2",
  "uvicorn>=0.34,<0.35",
  "requests>=2.31.0",
  "termcolor",
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
version = "0.0.1"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/inteligencIA-AGI/gpt-oss-AGI"
Repository = "https://github.com/inteligencIA-AGI/gpt-oss-AGI"
Documentation = "https://github.com/inteligencIA-AGI/gpt-oss-AGI#readme"
Issues = "https://github.com/inteligencIA-AGI/gpt-oss-AGI/issues"
"OpenAI gpt-oss upstream" = "https://github.com/openai/gpt-oss"

[project.optional-dependencies]
agix = ["agix==1.9.0"]
triton = ["triton", "safetensors>=0.5.3", "torch>=2.7.0"]
torch = ["safetensors>=0.5.3", "torch>=2.7.0"]
metal = ["numpy", "tqdm", "safetensors", "torch"]
test = ["pytest>=8.4.1", "httpx>=0.28.1", "openai-harmony"]
eval = ["pandas", "numpy", "openai", "jinja2", "tqdm", "blobfile"]
agix-neuro = ["agix[neuro]==1.9.0"]
agix-ml = ["agix[ml]==1.9.0"]
agix-data = ["agix[data]==1.9.0"]
agix-full = ["agix[ml,data,neuro]==1.9.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "gpt_oss_build_backend.backend"
backend-path = ["_build"]

[tool.setuptools.packages.find]
include = ["gpt_oss*", "agicore_core*"]

[tool.setuptools.package-data]
agicore_core = ["config/*.json"]

[tool.scikit-build]
cmake.source-dir = "." # pick up the root CMakeLists.txt
cmake.args = [
  "-DGPTOSS_BUILD_PYTHON=ON",
  "-DCMAKE_BUILD_TYPE=Release",
  "-DBUILD_SHARED_LIBS=OFF",
]
[tool.scikit-build.wheel]
packages = ["gpt_oss"] # copy the whole Python package tree

[tool.ruff.lint]
# The current fork still contains upstream scripts and tests with deliberate
# late imports for path bootstrapping/stubbing plus legacy unused symbols.
# Keep CI focused on running Ruff consistently while those categories are
# addressed in dedicated cleanup changes.
ignore = ["E402", "F401", "F402", "F541", "F841"]
